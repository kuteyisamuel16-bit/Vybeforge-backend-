[project]
name = "vybeforge-backend"
version = "0.1.0"
description = "VYBEFORGE API — Foundation layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.30.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "alembic==1.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

